name: LibraSphere CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DATABASE_URL: "file:./dev.db"
  JWT_ACCESS_SECRET: "librasphere_jwt_access_secret_super_secure_key_123456"
  JWT_REFRESH_SECRET: "librasphere_jwt_refresh_secret_super_secure_key_654321"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  NODE_ENV: test

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Environment Files
        run: |
          cp server/.env.example server/.env

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client & push SQLite schema
        run: |
          npm run prisma:generate --workspace=server
          npm run prisma:push --workspace=server

      - name: Seed database
        run: npm run seed

      - name: Run automated test suite
        run: npm run test --workspace=server

      - name: Build frontend & backend
        run: npm run build
